name: PC app (Windows exe)
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pc/requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --collect-all vgamepad --name WheelPadServer pc/wheelpad_server.py
      - run: |
          mkdir release
          copy dist\WheelPadServer.exe release\WheelPadServer.exe
          copy pc\Install-WheelPad.bat release\Install-WheelPad.bat
          copy pc\Uninstall-WheelPad.bat release\Uninstall-WheelPad.bat
      - uses: actions/upload-artifact@v4
        with:
          name: WheelPad-PC-Windows
          path: release
